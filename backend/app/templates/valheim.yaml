id: valheim
name: "Valheim Dedicated Server"
app_id: 896660
# Set anonymous_login: false for App IDs that require an owning Steam account
# (the panel will then ask for credentials + a Steam Guard code at install time).
anonymous_login: true
install_dir: /data
ports:
  # Valheim binds {{PORT_game}} (game) and PORT_game+1 (UDP query/Steam port),
  # so it needs two consecutive UDP ports — the allocator reserves the block.
  - name: game
    protocol: udp
    default: 2456
    count: 2
# Valheim's dedicated server initialises the Steam API as App ID 892970; without
# it the process exits immediately. LD_LIBRARY_PATH (./linux64) is set generically
# by the container entrypoint, so the startup line below stays clean.
env:
  SteamAppId: "892970"
startup: >
  ./valheim_server.x86_64 -nographics -batchmode -name "{{SERVER_NAME}}"
  -port {{PORT_game}} -world "Dedicated" -password "{{SERVER_PASSWORD}}" -public 0
variables:
  - key: SERVER_NAME
    default: "My Valheim Server"
  - key: SERVER_PASSWORD
    default: ""          # empty => the panel generates one (min 5 chars for Valheim)
update_on_start: true

# Valheim answers Steam A2S queries on PORT_game+1 (the query/Steam port).
# A2S_PLAYER returns the count but usually no names.
query:
  port: game
  offset: 1
